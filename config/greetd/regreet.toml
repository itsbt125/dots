# ReGreet — greetd greeter config

# No [background] section: flat mocha color, styled via /etc/greetd/regreet.css

[env]

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
cursor_blink = true
font_name = "JetBrainsMono Nerd Font 14"
icon_theme_name = "Adwaita"

[commands]
reboot = ["loginctl", "reboot"]
poweroff = ["loginctl", "poweroff"]

[appearance]
greeting_msg = "Welcome back"

[widget.clock]
format = "%a %d %b  %H:%M"
resolution = "500ms"
label_width = 280
