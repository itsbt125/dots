# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=16
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=10

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=0
tap_and_drag=0
click_method=2
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=0
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=30
gappiv=30
gappoh=30
gappov=20
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x1e1e2eff
bordercolor=0x313244ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0x6c7086ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# HiDPI (2560x1600 eDP-1, ~215 PPI): fractional scale for UI apps
monitorrule=name:^eDP-1$,scale:1.3

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
#
# SUPER is the primary modifier throughout.
#   SUPER              act on focused window / switch view
#   SUPER+SHIFT        move the thing (window, tag, monitor)
#   SUPER+CTRL         nudge a floating window
#   SUPER+CTRL+SHIFT   resize a floating window
#
# NOTE: Mango spawns with execvp, NOT a shell -- so a spawn line cannot
# contain ';', '&&', pipes or globs. One command with plain arguments only.
# Anything fancier belongs in a script.

# --- session ------------------------------------------------------------
bind=SUPER,r,reload_config
# quit is deliberately awkward: it used to be SUPER+m, next to SUPER+n
bind=SUPER+CTRL+SHIFT,q,quit

# --- launching ----------------------------------------------------------
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,wofi --show drun
bind=SUPER+SHIFT,v,spawn,clipboard-history
bind=SUPER,q,killclient,
bind=SUPER,b,spawn,librewolf
# --- focus --------------------------------------------------------------
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,focusstack,next
bind=SUPER,Escape,togglejump,

# --- move windows within the layout -------------------------------------
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# --- floating windows: nudge and resize by keyboard ---------------------
bind=SUPER+CTRL,Left,movewin,-50,+0
bind=SUPER+CTRL,Right,movewin,+50,+0
bind=SUPER+CTRL,Up,movewin,+0,-50
bind=SUPER+CTRL,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,resizewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,resizewin,+50,+0
bind=SUPER+CTRL+SHIFT,Up,resizewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,resizewin,+0,+50

# --- tags ---------------------------------------------------------------
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,bracketleft,viewtoleft_have_client,0
bind=SUPER,bracketright,viewtoright_have_client,0
bind=SUPER+SHIFT,bracketleft,tagtoleft,0
bind=SUPER+SHIFT,bracketright,tagtoright,0

# --- window state -------------------------------------------------------
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,v,togglefloating,
bind=SUPER,backslash,togglefloating,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER,o,toggleoverlay,
bind=SUPER,g,toggleglobal,

# --- layout -------------------------------------------------------------
bind=SUPER,n,switch_layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,
bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down

# --- gaps ---------------------------------------------------------------
bind=SUPER+SHIFT,x,incgaps,1
bind=SUPER+SHIFT,z,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps

# --- monitors -----------------------------------------------------------
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# --- screenshots --------------------------------------------------------
# These call scripts because spawn is execvp-only and cannot pipe.
# No Print key on this keyboard: F6 takes over (Shift+F6 = full screen).
bind=NONE,F6,spawn,mango-screenshot-region
bind=SHIFT,F6,spawn,mango-screenshot-full

# --- audio (PipeWire via wpctl) -----------------------------------------
# -l 1.0 caps at 100% so repeated presses cannot drive the sink into
# software gain and distort.
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- brightness ---------------------------------------------------------
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# --- lock and logout ----------------------------------------------------
bind=SUPER,l,spawn,/home/brandon/.local/bin/lock-screen
bind=SUPER+SHIFT,e,spawn,wlogout

# --- Mouse Bindings -----------------------------------------------------
# Drag to move / resize. These act on the window under the cursor; a tiled
# window is placed by the layout, so grab it only after SUPER+v floats it.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
# trackpad-friendly resize: left button + SUPER+SHIFT (right-drag is awkward on a touchpad)
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize
mousebind=SUPER,btn_right,moveresize,curresize

# --- Axis Bindings ------------------------------------------------------
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rule
layerrule=animation_type_open:zoom,layer_name:wofi
layerrule=animation_type_close:zoom,layer_name:wofi
